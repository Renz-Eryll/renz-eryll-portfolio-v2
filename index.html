    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Renz Eryll Ramelo — full-stack engineer building production web apps in Python, TypeScript, React and Next.js. Serverless APIs, admin tools and client platforms, shipped with tests."
    />
    <meta name="author" content="Renz Eryll Ramelo" />
    <meta name="theme-color" content="#F0F2F5" />
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta property="og:title" content="Renz Eryll Ramelo — Full-Stack Engineer" />
    <meta
      property="og:description"
      content="Renz Eryll Ramelo — full-stack engineer building production web apps in Python, TypeScript, React and Next.js. Serverless APIs, admin tools and client platforms, shipped with tests."
